# Publica el sitio en GitHub Pages automáticamente en cada push a la rama.
name: Desplegar en GitHub Pages

on:
  push:
    branches: ["claude/sitio-shows-stand-up-s60meu"]
  workflow_dispatch:

# Permisos necesarios para publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos; deja terminar el que esté en curso
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  desplegar:
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir el sitio como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
