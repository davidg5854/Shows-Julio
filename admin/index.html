<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel de edición · Julio Alfonzo</title>
  <style>
    /* Barra flotante con los accesos a cada sitio y la promoción */
    #barra-julio {
      position: fixed; right: 12px; bottom: 12px; z-index: 2147483000;
      display: flex; align-items: flex-end; gap: 6px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    #barra-julio .acciones { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    #barra-julio a, #barra-julio button {
      display: inline-flex; align-items: center; gap: 5px;
      background: #1a1a1a; color: #ece2cd; border: 1px solid #444; border-radius: 999px;
      padding: 7px 13px; font-size: 12px; font-weight: 700; text-decoration: none;
      cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,.4); transition: background .2s, border-color .2s;
    }
    #barra-julio a:hover, #barra-julio button:hover { background: #2a2a2a; border-color: #e5372b; }
    #barra-julio .promover { background: #e5372b; border-color: #e5372b; color: #fff; }
    #barra-julio .promover:hover { background: #c22a20; }
    /* El botón que pliega/despliega solo hace falta en pantallas chicas */
    #barra-julio #toggle-julio { display: none; }

    /* Distintivo para las fechas que ya pasaron y no se ven en la web */
    .julio-pasado {
      display: inline-block; margin-left: 8px; padding: 1px 7px;
      border-radius: 999px; background: #e5372b; color: #fff;
      font-size: 10px; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; vertical-align: 1px; white-space: nowrap;
    }

    @media (max-width: 700px) {
      /* Se sube para no tapar la barra de navegación del panel */
      #barra-julio { bottom: 84px; right: 10px; flex-direction: column; align-items: flex-end; }
      #barra-julio #toggle-julio { display: inline-flex; width: 44px; height: 44px; padding: 0; justify-content: center; font-size: 18px; }
      #barra-julio .acciones { display: none; flex-direction: column; align-items: flex-end; margin-bottom: 6px; }
      #barra-julio.abierto .acciones { display: flex; }
    }
  </style>
</head>
<body>
  <!-- Panel para editar el contenido del sitio -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

  <!-- Accesos rápidos -->
  <div id="barra-julio">
    <div class="acciones">
      <a href="https://julio-staging.pages.dev/" target="_blank" rel="noopener" title="Ver los cambios que aún no están publicados">🧪 Sitio de prueba</a>
      <a href="https://julioalfonzo.com/" target="_blank" rel="noopener" title="La web que ve el público">🌐 Sitio real</a>
      <button type="button" class="promover" id="btn-promover" title="Pasar los cambios de prueba a la web real">🚀 Promover</button>
    </div>
    <button type="button" id="toggle-julio" aria-label="Mostrar u ocultar los accesos" title="Accesos rápidos">🚀</button>
  </div>

  <script>
    // URL del servicio que publica los cambios (worker). Si está vacía,
    // el botón abre la página con las instrucciones paso a paso.
    var URL_PROMOTOR = "https://julio-promotor.davidg5854.workers.dev/";

    // En pantallas chicas la barra se pliega para no tapar la navegación
    (function () {
      var barra = document.getElementById("barra-julio");
      var toggle = document.getElementById("toggle-julio");
      if (!barra || !toggle) return;
      toggle.addEventListener("click", function () { barra.classList.toggle("abierto"); });
      barra.addEventListener("click", function (e) {
        if (e.target.closest(".acciones a")) barra.classList.remove("abierto");
      });
    })();

    (function () {
      var btn = document.getElementById("btn-promover");
      if (!btn) return;

      btn.addEventListener("click", async function () {
        if (!URL_PROMOTOR) { window.location.href = "promover.html"; return; }

        var clave = localStorage.getItem("clave-promover");
        if (!clave) {
          clave = prompt("Clave para publicar (se guarda en este navegador):");
          if (!clave) return;
        }
        if (!confirm("¿Publicar en julioalfonzo.com los cambios que probaste?")) return;

        var textoOriginal = btn.textContent;
        btn.textContent = "⏳ Publicando...";
        btn.disabled = true;
        try {
          var r = await fetch(URL_PROMOTOR, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ clave: clave }),
          });
          var d = await r.json();
          if (d.ok) {
            localStorage.setItem("clave-promover", clave);
            alert(d.estado === "sin-cambios"
              ? "No había cambios nuevos: la web real ya está al día. 👌"
              : "¡Listo! En 1 o 2 minutos los cambios estarán en julioalfonzo.com 🎉");
          } else {
            if (r.status === 401) localStorage.removeItem("clave-promover");
            alert("No se pudo publicar: " + (d.error || "error desconocido"));
          }
        } catch (e) {
          alert("No se pudo conectar con el servicio de publicación.");
        }
        btn.textContent = textoOriginal;
        btn.disabled = false;
      });
    })();
  </script>

  <script>
    // Marca en la lista de fechas las que ya pasaron: siguen guardadas
    // pero la web solo muestra las futuras. Sveltia no permite condiciones
    // en el resumen, así que se marca acá al vuelo.
    (function () {
      var PATRON = /^\s*(\d{4})-(\d{2})-(\d{2})\s*·/;

      function esPasada(texto) {
        var m = PATRON.exec(texto);
        if (!m) return null;
        var fecha = new Date(+m[1], +m[2] - 1, +m[3]);
        var hoy = new Date();
        hoy.setHours(0, 0, 0, 0);
        return fecha < hoy;
      }

      function marcar() {
        var nodos = document.querySelectorAll("div, span, p, h1, h2, h3, h4, h5, h6, button, summary");
        for (var i = 0; i < nodos.length; i++) {
          var el = nodos[i];
          if (el.children.length || el.dataset.julioPasado) continue;
          var pasada = esPasada(el.textContent || "");
          if (pasada !== true) continue;
          el.dataset.julioPasado = "1";
          el.style.opacity = "0.55";
          var etiqueta = document.createElement("span");
          etiqueta.className = "julio-pasado";
          etiqueta.textContent = "ya pasó";
          etiqueta.title = "Esta fecha ya pasó: sigue guardada acá, pero no se muestra en la web.";
          el.appendChild(etiqueta);
        }
      }

      var pendiente = false;
      function agendar() {
        if (pendiente) return;
        pendiente = true;
        requestAnimationFrame(function () { pendiente = false; marcar(); });
      }

      new MutationObserver(agendar).observe(document.body, { childList: true, subtree: true });
      agendar();
    })();
  </script>
</body>
</html>
