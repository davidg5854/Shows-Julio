# ===================================================================
# Configuración del panel de edición (Sveltia CMS)
# ===================================================================
backend:
  name: github
  repo: davidg5854/Shows-Julio
  branch: claude/sitio-shows-stand-up-s60meu
  # URL del servicio de autenticación (worker de Cloudflare)
  base_url: https://sveltia-cms-julio.davidg5854.workers.dev

# Idioma del panel
locale: es

# Carpeta donde se guardan las imágenes que subas desde el panel
media_folder: "img"
public_folder: "/img"

# Mensaje de los commits que genera el panel
site_url: https://julioalfonzo.com
display_url: https://julioalfonzo.com

collections:
  # ---------- Fechas / Shows ----------
  - name: fechas
    label: "Fechas / Shows"
    files:
      - name: shows
        label: "Próximas fechas"
        file: "datos/shows.json"
        description: "Agregá, editá o quitá los shows. Se ordenan por fecha automáticamente en la web y las fechas pasadas dejan de mostrarse solas."
        fields:
          - name: shows
            label: "Shows"
            label_singular: "Show"
            widget: list
            summary: "{{fields.fecha}} · {{fields.ciudad}}"
            fields:
              - { name: fecha, label: "Fecha", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, format: "YYYY-MM-DD" }
              - { name: ciudad, label: "Ciudad (título grande)", widget: string, hint: "Ejemplo: Buenos Aires" }
              - { name: lugar, label: "Lugar", widget: string, hint: "Ejemplo: Factoría Social Club · Fragata Sarmiento" }
              - { name: hora, label: "Hora", widget: string, default: "21:00", required: false }
              - { name: tipo, label: "Tipo de entrada", widget: select, options: ["pago", "gratis"], default: "pago" }
              - { name: estado, label: "Estado", widget: select, options: ["disponible", "agotado", "proximamente"], default: "disponible" }
              - { name: etiqueta, label: "Etiqueta (opcional)", widget: string, required: false, hint: "Ejemplo: Reservas gratis. Si lo dejás vacío, muestra 'Entradas a la venta'." }
              - { name: entradas, label: "Link de entradas", widget: string, hint: "El enlace donde se compran/reservan las entradas." }
              - { name: boton, label: "Texto del botón", widget: string, default: "Entradas", required: false }

  # ---------- Configuración del sitio ----------
  - name: config
    label: "Configuración del sitio"
    files:
      - name: general
        label: "Analytics, redes y contacto"
        file: "datos/config.json"
        description: "IDs de analítica/publicidad, enlaces de redes y correo de contacto. Dejá un campo vacío para desactivar esa herramienta o esconder esa red."
        fields:
          - name: analytics
            label: "Analytics y publicidad"
            widget: object
            fields:
              - { name: ga4, label: "ID de Google Analytics (GA4)", widget: string, required: false, hint: "Ejemplo: G-XXXXXXXXXX. Vacío = desactivado." }
              - { name: clarity, label: "ID de Microsoft Clarity", widget: string, required: false, hint: "Vacío = desactivado." }
              - { name: metaPixel, label: "ID del Pixel de Meta", widget: string, required: false, hint: "Vacío = desactivado." }
          - name: redes
            label: "Redes sociales (URLs)"
            widget: object
            fields:
              - { name: instagram, label: "Instagram", widget: string, required: false }
              - { name: youtube, label: "YouTube", widget: string, required: false }
              - { name: facebook, label: "Facebook", widget: string, required: false }
              - { name: threads, label: "Threads", widget: string, required: false }
              - { name: substack, label: "Newsletter (Substack)", widget: string, required: false }
          - name: contacto
            label: "Contacto"
            widget: object
            fields:
              - { name: email, label: "Email de contacto", widget: string }

  # ---------- Textos y fotos ----------
  - name: contenido
    label: "Textos y fotos"
    files:
      - name: general
        label: "Textos e imágenes del sitio"
        file: "datos/contenido.json"
        description: "Editá los textos y las fotos del sitio. En los textos podés usar *cursiva* y **negrita**."
        fields:
          - name: imagenes
            label: "Fotos"
            widget: object
            fields:
              - { name: hero, label: "Foto de portada (fondo del hero)", widget: image, hint: "Ideal horizontal y en buena calidad." }
              - { name: bio, label: "Foto de la bio", widget: image, hint: "Ideal vertical (retrato)." }
          - name: hero
            label: "Portada (hero)"
            widget: object
            fields:
              - { name: eyebrow, label: "Texto pequeño de arriba", widget: string }
          - name: bio
            label: "Bio (Sobre Julio)"
            widget: object
            fields:
              - { name: cita, label: "Frase / cita", widget: string }
              - { name: resaltado, label: "Palabras en rojo dentro de la frase", widget: string, required: false, hint: "Deben aparecer tal cual en la frase de arriba." }
              - { name: autor, label: "Autor de la frase", widget: string }
              - { name: texto, label: "Texto de la bio", widget: text, hint: "Separá los párrafos con una línea en blanco. Usá *cursiva* y **negrita**." }
          - name: newsletter
            label: "Newsletter"
            widget: object
            fields:
              - { name: titulo, label: "Título", widget: string, hint: "Para una palabra en rojo, ponela entre asteriscos. Ej: ¿Quieres *más*?" }
              - { name: texto, label: "Texto", widget: text }
